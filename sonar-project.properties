# Configuración de SonarQube (el servidor es efímero: lo levanta el pipeline en cada ejecución).
sonar.projectKey=devsecops-gitops-challenge
sonar.projectName=DevSecOps GitOps Challenge
sonar.sourceEncoding=UTF-8

sonar.sources=app/src
sonar.tests=app/test,app/test-integration
sonar.javascript.lcov.reportPaths=app/lcov.info
# Punto de entrada y sonda de Docker: se validan en ejecución (DAST/integración), no en unitarias.
sonar.coverage.exclusions=app/src/index.js,app/src/healthcheck.js
