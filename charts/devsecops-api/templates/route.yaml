{{- if .Values.route.enabled -}}
# Route de OpenShift: expone el Service a través del Router con TLS en el borde
# y redirección forzada de HTTP a HTTPS.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ include "devsecops-api.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "devsecops-api.labels" . | nindent 4 }}
  annotations:
    haproxy.router.openshift.io/hsts_header: max-age=63072000;includeSubDomains
    {{- with .Values.route.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- with .Values.route.host }}
  host: {{ . | quote }}
  {{- end }}
  to:
    kind: Service
    name: {{ include "devsecops-api.fullname" . }}
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
{{- end }}
