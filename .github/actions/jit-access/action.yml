# Acceso JUST-IN-TIME al entorno efímero (zero-trust de red):
#   mode=open  -> autoriza SOLO la IP pública de este runner (/32) en el puerto 8080
#   mode=close -> revoca las reglas de ESTE job (se ejecuta siempre, aunque el job falle)
# Sin estado entre pasos: cada regla lleva la descripción única jit-<run>-<job> y el cierre
# revoca por esa descripción (también limpia reglas huérfanas de un reintento del job).
name: jit-access
description: Abre o revoca el acceso /32 del runner al security group del entorno efímero

inputs:
  security-group-id:
    description: Security group del entorno (output de Terraform)
    required: true
  mode:
    description: open | close
    required: true

runs:
  using: composite
  steps:
    - name: Acceso just-in-time (${{ inputs.mode }})
      shell: bash
      env:
        SG_ID: ${{ inputs.security-group-id }}
        MODE: ${{ inputs.mode }}
      run: |
        set -euo pipefail
        [[ "$SG_ID" =~ ^sg-[0-9a-f]{8,17}$ ]] || { echo "security group inválido: $SG_ID"; exit 1; }
        tag="jit-${GITHUB_RUN_ID}-${GITHUB_JOB}"
        case "$MODE" in
          open)
            ip="$(curl -fsS https://checkip.amazonaws.com | tr -d '[:space:]')"
            [[ "$ip" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]] || { echo "IP del runner inválida"; exit 1; }
            aws ec2 authorize-security-group-ingress --group-id "$SG_ID" \
              --ip-permissions "IpProtocol=tcp,FromPort=8080,ToPort=8080,IpRanges=[{CidrIp=${ip}/32,Description=${tag}}]" >/dev/null
            echo "Acceso abierto para ${ip}/32 (${tag})"
            sleep 5 # propagación de la regla
            ;;
          close)
            ids="$(aws ec2 describe-security-group-rules --filters "Name=group-id,Values=${SG_ID}" \
                    --query "SecurityGroupRules[?Description=='${tag}'].SecurityGroupRuleId" --output text)"
            if [ -n "$ids" ] && [ "$ids" != "None" ]; then
              # shellcheck disable=SC2086 # lista de IDs separada por espacios, intencional
              aws ec2 revoke-security-group-ingress --group-id "$SG_ID" --security-group-rule-ids $ids >/dev/null
              echo "Acceso revocado (${tag})"
            fi
            ;;
          *)
            echo "mode debe ser open o close"; exit 1
            ;;
        esac
