# Dependabot mantiene al día las versiones fijadas (SHAs de acciones, digests de
# imágenes y paquetes npm) mediante PRs que pasan por el mismo pipeline de seguridad.
# cooldown: espera 7 días antes de proponer una versión nueva; la mayoría de paquetes
# maliciosos publicados en ataques de supply chain se detectan y retiran antes.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /app
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # Solo versiones LTS de Node (pares). Los saltos de versión mayor se planifican a mano.
      - dependency-name: node
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
